[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skystamp"
version = "1.2.1"
description = "Burn DJI drone telemetry (SRT) into your videos: simple desktop app, Windows/macOS/Linux."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vlad Roșca" }]
dependencies = ["PySide6>=6.6", "Pillow>=10.1", "numpy>=1.26", "imageio-ffmpeg>=0.5", "certifi"]

[project.urls]
Homepage = "https://getskystamp.app"
Source = "https://github.com/Drone-Log/SkyStamp"
Issues = "https://github.com/Drone-Log/SkyStamp/issues"

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "dmgbuild; sys_platform == 'darwin'"]

[project.scripts]
skystamp-cli = "skystamp.cli:main"

[project.gui-scripts]
skystamp = "skystamp.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skystamp = ["assets/*", "assets/fonts/*"]
