name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: SkyStamp-windows-x64.zip }
          - { os: macos-15,       artifact: SkyStamp-macos-arm64.dmg }
          - { os: macos-15-intel, artifact: SkyStamp-macos-intel.dmg }
          - { os: ubuntu-22.04,   artifact: SkyStamp-linux-x86_64.AppImage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux Qt deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2
      - run: pip install -e ".[dev]"
      - run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/SkyStamp -DestinationPath ${{ matrix.artifact }}
      - name: Package (macOS, signed + notarized when secrets are set)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No signing secrets: building an unsigned dmg"
            hdiutil create -volname SkyStamp -srcfolder dist/SkyStamp.app -ov -format UDZO ${{ matrix.artifact }}
            exit 0
          fi
          # Throwaway keychain holding the Developer ID certificate
          KC="$RUNNER_TEMP/sign.keychain-db"; KC_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" \
            packaging/macos_sign.sh "$MACOS_SIGN_IDENTITY" dist/SkyStamp.app ${{ matrix.artifact }}
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin && cp -r dist/SkyStamp/* AppDir/usr/bin/
          cp packaging/skystamp.desktop AppDir/ && cp src/skystamp/assets/icon.png AppDir/skystamp.png
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/SkyStamp" "$@"\n' > AppDir/AppRun && chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.artifact }}", path: "${{ matrix.artifact }}" }

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }
